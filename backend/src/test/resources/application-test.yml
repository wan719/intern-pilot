spring:
  datasource:
    url: jdbc:h2:mem:intern_pilot_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always
      schema-locations: classpath:sql/test-schema.sql
      data-locations: classpath:sql/test-data.sql

  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: intern-pilot-test-secret-key-please-change-to-long-enough-string
  expiration: 3600000

auth:
  captcha:
    mode: mock
    email-provider: mock
    sms-provider: disabled

ai:
  provider: mock
  base-url: mock
  api-key: test
  model: mock-ai
  pro-model: mock-ai-pro
  default-model: mock-ai
  fallback-model: mock-ai
  scenario-model:
    RESUME_JOB_ANALYSIS: mock-ai
    JOB_RECOMMENDATION: mock-ai
    INTERVIEW_QUESTION_GENERATION: mock-ai
    INTERVIEW_QUESTION_REGENERATION: mock-ai
    RAG_QA: mock-ai
    RESUME_OPTIMIZATION: mock-ai
  retry:
    enabled: false
    max-attempts: 1
  timeout-seconds: 3

rag:
  enabled: false
  top-k: 3
  embedding:
    provider: mock
    model: mock-embedding-64

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

system:
  cleanup:
    enabled: false
