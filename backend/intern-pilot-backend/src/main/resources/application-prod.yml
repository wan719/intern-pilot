server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:intern_pilot}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SSL_ENABLED:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

auth:
  captcha:
    mode: ${AUTH_CAPTCHA_MODE:real}
    email-provider: ${AUTH_EMAIL_CAPTCHA_PROVIDER:smtp}
    sms-provider: ${AUTH_SMS_CAPTCHA_PROVIDER:disabled}

file:
  upload-dir: uploads/resumes
  max-size: 10485760
  allowed-types:
    - pdf
    - docx

ai:
  provider: ${AI_PROVIDER:deepseek}
  base-url: ${AI_BASE_URL:https://api.deepseek.com}
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${AI_MODEL:deepseek-v4-flash}
  pro-model: ${AI_PRO_MODEL:deepseek-v4-pro}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:60}

sms:
  tencent:
    secret-id: ${TENCENT_SMS_SECRET_ID:}
    secret-key: ${TENCENT_SMS_SECRET_KEY:}
    region: ${TENCENT_SMS_REGION:ap-guangzhou}
    sdk-app-id: ${TENCENT_SMS_SDK_APP_ID:}
    sign-name: ${TENCENT_SMS_SIGN_NAME:}
    template-id: ${TENCENT_SMS_TEMPLATE_ID:}
    template-has-expire-minutes: ${TENCENT_SMS_TEMPLATE_HAS_EXPIRE_MINUTES:false}

rag:
  enabled: ${RAG_ENABLED:true}
  top-k: ${RAG_TOP_K:5}
  embedding:
    provider: ${RAG_EMBEDDING_PROVIDER:mock}
    model: ${RAG_EMBEDDING_MODEL:mock-embedding-64}
