server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: true
    redis:
      enabled: true
    mail:
      enabled: false

info:
  app:
    name: InternPilot Backend
    description: Spring Boot API for InternPilot

spring:
  application:
    name: intern-pilot-backend

  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SSL_ENABLED:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.internpilot.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true

ai:
  provider: ${AI_PROVIDER:deepseek}
  base-url: ${AI_BASE_URL:https://api.deepseek.com}
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${AI_MODEL:deepseek-v4-flash}
  pro-model: ${AI_PRO_MODEL:deepseek-v4-pro}
  default-model: ${AI_DEFAULT_MODEL:${AI_MODEL:deepseek-v4-flash}}
  fallback-model: ${AI_FALLBACK_MODEL:${AI_MODEL:deepseek-v4-flash}}
  models:
    flash: ${AI_MODEL:deepseek-v4-flash}
    pro: ${AI_PRO_MODEL:deepseek-v4-pro}
  scenario-model:
    RESUME_JOB_ANALYSIS: ${AI_RESUME_JOB_ANALYSIS_MODEL:${AI_PRO_MODEL:deepseek-v4-pro}}
    JOB_RECOMMENDATION: ${AI_JOB_RECOMMENDATION_MODEL:${AI_MODEL:deepseek-v4-flash}}
    INTERVIEW_QUESTION_GENERATION: ${AI_INTERVIEW_QUESTION_GENERATION_MODEL:${AI_MODEL:deepseek-v4-flash}}
    INTERVIEW_QUESTION_REGENERATION: ${AI_INTERVIEW_QUESTION_REGENERATION_MODEL:${AI_MODEL:deepseek-v4-flash}}
    RAG_QA: ${AI_RAG_QA_MODEL:${AI_PRO_MODEL:deepseek-v4-pro}}
    RESUME_OPTIMIZATION: ${AI_RESUME_OPTIMIZATION_MODEL:${AI_PRO_MODEL:deepseek-v4-pro}}
  retry:
    enabled: ${AI_RETRY_ENABLED:true}
    max-attempts: ${AI_RETRY_MAX_ATTEMPTS:2}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:60}

auth:
  captcha:
    mode: ${AUTH_CAPTCHA_MODE:mock}
    email-provider: ${AUTH_EMAIL_CAPTCHA_PROVIDER:mock}
    sms-provider: ${AUTH_SMS_CAPTCHA_PROVIDER:disabled}
    ttl-seconds: ${AUTH_CAPTCHA_TTL:300}
    cooldown-seconds: ${AUTH_CAPTCHA_COOLDOWN:60}
    max-fail-count: ${AUTH_CAPTCHA_MAX_FAIL:5}
    daily-limit: ${AUTH_CAPTCHA_DAILY_LIMIT:10}

sms:
  tencent:
    secret-id: ${TENCENT_SMS_SECRET_ID:}
    secret-key: ${TENCENT_SMS_SECRET_KEY:}
    region: ${TENCENT_SMS_REGION:ap-guangzhou}
    sdk-app-id: ${TENCENT_SMS_SDK_APP_ID:}
    sign-name: ${TENCENT_SMS_SIGN_NAME:}
    template-id: ${TENCENT_SMS_TEMPLATE_ID:}
    template-has-expire-minutes: ${TENCENT_SMS_TEMPLATE_HAS_EXPIRE_MINUTES:false}

system:
  execution-time:
    warn-threshold-ms: ${EXECUTION_TIME_WARN_THRESHOLD_MS:1500}
  cleanup:
    enabled: ${SYSTEM_CLEANUP_ENABLED:true}
    cron: ${SYSTEM_CLEANUP_CRON:0 30 3 * * *}
    analysis-task-retention-days: ${ANALYSIS_TASK_RETENTION_DAYS:30}
    operation-log-retention-days: ${OPERATION_LOG_RETENTION_DAYS:90}
    redis-task-notification-retention-hours: ${REDIS_TASK_NOTIFICATION_RETENTION_HOURS:24}
